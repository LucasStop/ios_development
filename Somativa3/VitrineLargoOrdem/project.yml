name: VitrineLargoOrdem
options:
  bundleIdPrefix: br.pucpr.lucasstopinski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  VitrineLargoOrdem:
    type: application
    platform: iOS
    sources:
      - path: VitrineLargoOrdem
    info:
      path: VitrineLargoOrdem/Info.plist
      properties:
        CFBundleDisplayName: Vitrine Largo
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.pucpr.lucasstopinski.VitrineLargoOrdem
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: "\"VitrineLargoOrdem/Preview Content\""
        ENABLE_PREVIEWS: YES
